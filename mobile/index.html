<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>YenTool</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#1E1E24" />
  <!-- iOS home-screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="YenTool" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css?v=30" />
</head>
<body>
  <!-- Header stays SHORT on purpose (report 7.4): the long strategy blurb used
       to be pinned here and ate half of a 375px screen. It is now a collapsible
       card inside the overview and research pages. -->
  <header id="topbar">
    <div class="title-row">
      <h1>YenTool</h1>
      <span id="asof" class="asof"></span>
      <button id="refresh" type="button" data-act="refresh" title="重新整理" aria-label="重新整理">↻</button>
    </div>
    <div id="notices" class="notices"></div>
  </header>

  <main id="pages">
    <section class="page" id="page-today" aria-label="今日總覽"></section>
    <section class="page" id="page-picks" aria-label="今日建議" hidden></section>
    <section class="page" id="page-positions" aria-label="我的持倉" hidden></section>
    <section class="page" id="page-perf" aria-label="績效與歷史" hidden></section>
    <section class="page" id="page-research" aria-label="研究與資料狀態" hidden></section>
    <div id="status" class="status"></div>
  </main>

  <nav id="tabs" class="tabs" aria-label="主要頁面"></nav>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="./app.js?v=30"></script>
</body>
</html>
