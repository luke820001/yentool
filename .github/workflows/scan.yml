# Daily cloud scan -> GitHub Pages. Runs the scanner on a schedule with NO PC,
# publishes mobile/scan_result.json to Pages so the phone PWA always sees the
# latest. Manual "Run workflow" (workflow_dispatch) doubles as a phone trigger.
#
# One-time setup is in mobile/DEPLOY.md. Key points:
#   - Settings > Pages > Source = "GitHub Actions".
#   - The big market DBs are cached (not committed) so git stays small; only the
#     accumulating ledger + hysteresis state are committed back.
name: daily-scan

on:
  schedule:
    # Taiwan is UTC+8, so subtract 8h. Three runs per trading day: 14:30 right
    # after the consolidated EOD publishes (~14:00) so the phone sees same-day
    # picks by mid-afternoon; 17:00 and 18:00 re-catch anything that was still
    # being published earlier. Mon-Fri only: the market is closed at weekends,
    # so a weekend run would just repeat Friday's data.
    #
    # THESE TIMES ARE NOT WHEN THE SCAN RUNS. This comment used to say cron
    # "may be delayed a few minutes under load -- fine here". That was measured
    # across all 136 scheduled runs of this workflow and it is false:
    #
    #     within 15 min of target   0 of 136  (0%)
    #     within 1 hour             ~21%
    #     median delay              ~126 min
    #     worst                     747 min (12h 27m)
    #
    # On 2026-08-27 and 08-28 every run landed 10-12.5 hours late, so the
    # "14:30 Taiwan" scan published after 01:00 the NEXT Taiwan day. Plan for a
    # 12-hour failure mode, not a 2-hour one.
    #
    # Adding more cron entries does NOT help: on 44 of 44 complete three-run
    # days all three entries slid by nearly the same offset (spread within a
    # day: median 47 min). The whole day slides as a block, so a fourth entry
    # just adds a fourth late run.
    #
    # The on-time trigger is scan-timer.yml: an early cron that only has to
    # arrive before 15:00, sleeps to 15:00 and dispatches this workflow (a
    # dispatch starts immediately) -- see docs/排程與即時行情.md. These cron
    # entries stay as a fallback: they do fire eventually, so if the timer dies
    # you degrade to the old late behaviour rather than to nothing.
    - cron: "30 6 * * 1-5"    # 14:30 Taiwan (first same-day scan)
    - cron: "0 9 * * 1-5"     # 17:00 Taiwan
    - cron: "0 10 * * 1-5"    # 18:00 Taiwan
  # Manual run button (also usable from the phone). Once a session's list is
  # final (scanner/list_freeze, "final-once-v1") every later run of that
  # session exits 3 without rescanning; force_rescan is the owner's way to
  # rebuild it anyway (Actions > daily-scan > Run workflow > tick the box).
  # The rebuilt list carries list_status.revision + 1 and revised_reason
  # force_rescan. Scheduled runs and the scan-timer never force.
  workflow_dispatch:
    inputs:
      force_rescan:
        description: "rebuild a session whose list is already final"
        type: boolean
        default: false

permissions:
  contents: write              # commit ledger/state back
  pages: write                 # deploy Pages
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.scan.outputs.published }}
      frozen: ${{ steps.scan.outputs.frozen }}
    # The scanner decides "is today's close published yet" from local wall time
    # (chip_verifier._latest_trading_day, _EOD_HOUR=14) and stamps scan_time
    # with datetime.now(). GitHub runners default to UTC, where every TW-daytime
    # run reads as before-06:00 -- the 14:30/17:00/18:00 scans would all target
    # YESTERDAY's session and never require the same-day bar. Pin Taiwan time.
    #
    # PAGES_URL: the freeze gate reads the published list_status from the live
    # site (same expression as scan-timer.yml). On scheduled events GitHub can
    # leave github.event.repository empty; list_freeze.pages_url() then falls
    # back to GITHUB_REPOSITORY.
    env:
      TZ: Asia/Taipei
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache the refetchable market DBs so runs start warm and stay fast.
      # First run (empty cache) cold-fetches everything -- slower but works.
      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: |
            data/price_volume.db
            data/inst_trades.db
            data/large_holder.db
            data/taiex.db
            data/tdcc_history.db
          key: marketdata-${{ github.run_id }}
          restore-keys: |
            marketdata-

      # Pinned resolution (constraints.txt): a scheduled job that writes
      # stops for real positions should not have its feed library change
      # under it overnight.
      - name: Install deps
        run: pip install -r requirements.txt -c constraints.txt

      # Exit codes are meaningful (scan_headless.main): 0 published, including a
      # legitimate day where nothing qualified; 1 the market feed was
      # unreachable so the previous data is deliberately left in place; 2 the
      # scan crashed; 3 the session's list is already final, nothing rescanned
      # or republished (the late crons, every day); 4 frozen too, but the
      # evening restriction lists changed the published restriction columns
      # and the amended payload in mobile/ goes out like a 0. Only 2 should
      # read as a build failure -- a quiet market, a temporary feed outage and
      # a frozen list are not bugs, and burying them in a red X trains
      # everyone to ignore the red X. (tools/check_scan_result.py --strict
      # also exits 3, meaning a failed check; no step here uses --strict.)
      - name: Run scan
        id: scan
        env:
          # Optional: set these as repo secrets to get real AI reports on the
          # phone. Without them, the scan still runs and uses a local text
          # summary. Gemini is primary, Groq is the fallback.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # empty on scheduled runs (no inputs) and on an unticked box
          YENTOOL_FORCE_RESCAN: ${{ inputs.force_rescan && '1' || '' }}
        run: |
          set +e
          python scan_headless.py mode_prelaunch
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "published=true"  >> "$GITHUB_OUTPUT" ;;
            1) echo "published=false" >> "$GITHUB_OUTPUT"
               echo "::warning::market feed unreachable; previous data kept" ;;
            3) echo "published=false" >> "$GITHUB_OUTPUT"
               echo "frozen=true"     >> "$GITHUB_OUTPUT"
               echo "::notice::list for this session is already final; nothing republished" ;;
            4) echo "published=true"  >> "$GITHUB_OUTPUT"
               echo "frozen=true"     >> "$GITHUB_OUTPUT"
               echo "amended=true"    >> "$GITHUB_OUTPUT"
               echo "::notice::list already final; restriction info amended and republished" ;;
            *) echo "::error::scan failed with exit $code"; exit "$code" ;;
          esac

      # Every column of what the phone is about to receive, checked against
      # its registry and the cross-column identities (scanner/result_checks.py).
      # The outcome is written into meta.checks (phone banner), appended to
      # data/scan_checks.json (history), and shown here as annotations. A
      # "fail" does not withhold the publish -- an explained bad file beats an
      # unexplained stale one -- but scan-timer treats it as "not done" and
      # retries through the afternoon.
      - name: Self-check every published column
        id: checks
        if: steps.scan.outputs.published == 'true'
        run: python tools/check_scan_result.py --annotate

      # The fixed first-day recommendations must survive between runs -- without
      # them every scan believes today is the first day each name qualified and
      # the price resets daily, defeating the point of recording it.
      #
      # What gets committed is data/recommendations.json, NOT the ledger
      # database. The database can hold real positions and fills; the JSON is
      # built by portfolio/publish.py from the recommendations table alone, with
      # every column named, so a position cannot reach a public file by
      # construction. An earlier version committed the .db itself, which was a
      # loaded gun: `git add -f` disarms .gitignore permanently for that path,
      # and a row-counting guard cannot see rows still sitting in SQLite
      # freelist pages after a delete. Report section 9.2.
      #
      # The guard below is defence in depth, not the mechanism.
      - name: Verify the ledger carries no private positions
        run: python tools/check_ledger_public.py

      # Upload BEFORE committing state. The phone's data must never wait on
      # git: on 2026-09-14 a scheduled run finished the scan, then failed its
      # push (see below) and, because the upload came after, never deployed.
      #
      # Only when this run actually produced a payload. Without the condition a
      # feed outage (exit 1, "previous data kept") uploaded mobile/ AS CHECKED
      # OUT -- and the repo no longer carries a payload at all, so that deploy
      # would have replaced the phone's data with nothing. Skipping the upload
      # leaves the previous deployment in place, which is what "previous data
      # kept" is supposed to mean.
      # The closed recommendations' complete trade records (2026-10-09): the
      # phone's performance page reads ./recommendations.json. It is the same
      # file this workflow already commits (built from the recommendations
      # table alone, no positions); this copy only rides into the Pages
      # artifact and is ignored by git like scan_result.json.
      - name: Publish recommendations.json next to the phone data
        if: steps.scan.outputs.published == 'true'
        run: |
          if [ -f data/recommendations.json ]; then
            cp data/recommendations.json mobile/recommendations.json
          fi

      - name: Upload Pages artifact (mobile/ with fresh scan_result.json)
        if: steps.scan.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile

      # Persist only the small, accumulating state: forward-performance ledger,
      # the public recommendations export, name cache, hysteresis held-set,
      # the column-check history, and the company-events cache
      # (data/company_events.json, ingestion/company_events: display-only
      # revenue / ex-date / conference data; the conference dates are
      # accumulated from one-day announcement files, so the cache has to
      # survive between runs). Market DBs stay in the cache above.
      #
      # Runs on EVERY non-crash outcome (0/1/3/4) -- deliberately no published
      # guard: an amend (4) changes the ledger and the recommendations export,
      # and a frozen run (3) normally has nothing to add, which the
      # `git diff --cached --quiet` check below turns into a no-op. A frozen
      # run may still have refreshed the name cache before its gate fired;
      # that alone is not worth a commit, so it is left unstaged.
      #
      # Two runs can overlap in wall time (scan-timer dispatch + a late cron:
      # the concurrency group serialises the JOBS, but both checked out the
      # same base commit before the other pushed). 2026-09-14 13:14Z: the
      # second push was rejected as non-fast-forward and the run went red.
      # Rebase onto whatever landed meanwhile and retry; on a conflict in the
      # state files this run's copy wins (-X theirs during a rebase is the
      # commit being replayed, i.e. ours), because it was produced later from
      # the same day's data.
      - name: Commit durable state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/signal_ledger.db data/stock_names.json data/scan_state 2>/dev/null || true
          git add data/recommendations.json 2>/dev/null || true
          # data/* is gitignored; the check history is meant to be committed.
          git add -f data/scan_checks.json 2>/dev/null || true
          git add -f data/company_events.json 2>/dev/null || true
          if [ "${{ steps.scan.outputs.frozen }}" = "true" ]; then
            git restore --staged data/stock_names.json 2>/dev/null || true
            # a frozen run never refreshes the events (it exits before the
            # refresh starts); never commit a stray copy either
            git restore --staged data/company_events.json 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "no state changes to commit"
            exit 0
          fi
          git commit -m "chore: daily scan $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            # `run:` is bash -e: an unguarded failed fetch would turn the job
            # red and skip the Pages deploy (needs: scan) for a state commit
            git fetch origin main || { echo "::warning::fetch failed (attempt $attempt)"; sleep $(( attempt * 7 )); continue; }
            # The cached market DBs are tracked files restored over the checkout,
            # so the worktree is always dirty here; without autostash the rebase
            # refuses to start (seen 2026-09-14: "You have unstaged changes").
            git -c rebase.autoStash=true rebase -X theirs origin/main || { git rebase --abort; git reset --hard origin/main; echo "::warning::state commit dropped after rebase conflict"; exit 0; }
            sleep $(( attempt * 7 ))
          done
          echo "::warning::could not push state after 5 attempts; the Pages deploy (a later job) still runs"

  deploy:
    needs: scan
    # No payload, no deploy: deploy-pages would fail on the missing artifact,
    # and a red run on a feed outage trains everyone to ignore red runs.
    if: needs.scan.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
